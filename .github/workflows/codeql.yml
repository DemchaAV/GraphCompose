name: CodeQL

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    # Run on any incoming PR regardless of the base branch so feature
    # branches targeting `develop` also get analysed.
  workflow_dispatch:
  schedule:
    - cron: '32 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    strategy:
      fail-fast: false
      matrix:
        language:
          - java-kotlin

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build (published code-bearing modules)
        # The extractor sees what the build compiles, so the module list is the
        # analysis scope. It covers every published module that carries code, which
        # is where the untrusted input actually lands: PDFBox and POI parsing, the
        # SVG and image paths, font loading, and the ZIP/OPC writers all live in the
        # backends rather than in core. `-am` is required — the backends need core
        # built from source, and without it Maven resolves the reactor siblings from
        # the repository and compiles nothing. It also pulls the fonts and emoji
        # modules in as dependencies, so the scanned set is the closure of this list,
        # not the list itself.
        #
        # Keep this list in step with the verify gate in ci.yml. A module that ships
        # and is not named here ships unscanned.
        run: |
          ./mvnw -B -ntp -DskipTests package -am \
            -pl :graph-compose-core,:graph-compose-render-pdf,:graph-compose-render-docx,:graph-compose-render-pptx,:graph-compose-templates,:graph-compose-testing

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
