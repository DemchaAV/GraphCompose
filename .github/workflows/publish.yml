name: Publish to Maven Central

# Publishes the v*-tagged artefact set to Maven Central via the
# central-publishing-maven-plugin in the `release` profile (Track D3).
# Triggered by the same `v*` tag push that fires release.yml (Track D4).
# The two workflows are independent — release.yml creates the GitHub
# Release; this one publishes the Maven Central artefacts. They can
# succeed or fail independently, and a maintainer can re-run this
# workflow alone via workflow_dispatch if Central had a transient
# validator hiccup without re-cutting the tag.
#
# The whole lockstep train ships as ONE Central deployment: a single
# `-P release deploy -pl <train>` over the root reactor. The plugin stages
# every selected module, then bundles and uploads them together from the
# last one, so one GraphCompose version is one publish operation (one
# Release Count event) holding eight components, each still its own
# coordinate for consumers. The deployment validates and publishes as a
# unit, so a release can no longer end half on Central. The root
# aggregator is not selected (and nothing inherits its maven.deploy.skip);
# examples, benchmarks, qa, coverage, fonts and emoji are not selected.
# fonts and emoji keep their own tags and workflows (publish-fonts.yml,
# publish-emoji.yml) and publish only when their own version moves.
#
# Hyphenated tags (rc / alpha / beta / SNAPSHOT) are skipped: those
# ship only to the GitHub Release pre-release surface, never to Central
# (Central's validator rejects SNAPSHOT-style coordinates anyway).
#
# Human prerequisites (one-time per repo):
#   1. Generate a GPG key locally; upload the public key to a
#      keyserver pool (keys.openpgp.org, keyserver.ubuntu.com).
#   2. Register at https://central.sonatype.com — verify the
#      `io.github.demchaav` namespace via GitHub OAuth or DNS TXT.
#   3. Generate a Central user token at Account -> Generate User Token.
#   4. Add four GitHub repo secrets at Settings -> Secrets and
#      variables -> Actions:
#         MAVEN_GPG_PRIVATE_KEY   — full ASCII-armored private key
#         MAVEN_GPG_PASSPHRASE    — passphrase for the key above
#         CENTRAL_USERNAME        — Central user-token username half
#         CENTRAL_TOKEN           — Central user-token password half
# See docs/contributing/release-process.md for the full runbook.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v*-prefixed tag to (re-)publish'
        required: true
        type: string
      skip_published:
        description: 'Recovery only: leave out components of this version that are already published on Maven Central, and publish the rest as one deployment. Keep false for a normal publish; set it ONLY after confirming which coordinates are live. A deployment that is still VALIDATED but unpublished is not "published" — publish or drop it in the Central portal first.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Serialize Maven Central publishes. Two runs must never overlap — two
# uploads of the same version would race to validate the same coordinates —
# so a constant group name funnels every tag / dispatch through one lane.
# cancel-in-progress is false so a re-tag or dispatch never aborts a publish
# already mid-upload; the second run queues behind it instead.
concurrency:
  group: publish-maven-central
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }} to Maven Central
    runs-on: ubuntu-latest
    # Only ship plain semver tags (vX.Y.Z) to Central. Pre-release tags
    # like v1.7.0-rc.1 ship to the GitHub Release pre-release surface only.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.ref, '-rc') && !contains(github.ref, '-alpha') && !contains(github.ref, '-beta') && !contains(github.ref, '-snapshot'))
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

    steps:
      - name: Reject non-final tags (Central publishes vX.Y.Z only)
        # This job runs on tag pushes AND workflow_dispatch. The job `if:` skips a PUSHED
        # pre-release tag, but a manual dispatch bypasses that clause (the first `if`
        # operand is unconditionally true for workflow_dispatch), so guard here as the
        # very first stage: Maven Central never receives a pre-release / snapshot tag,
        # matching cut-release.ps1's final-vs-pre-release split. The tag is passed via env
        # (not inlined into the script) to avoid shell injection from a crafted ref name.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Maven Central accepts only final vX.Y.Z tags: '$TAG' is a pre-release/snapshot and must not be published."
            exit 1
          fi
          echo "Publishing final release $TAG to Maven Central."

      - name: Check out repository at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Temurin JDK 17 with Central credentials and GPG key
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # `setup-java@v5` writes <server id="central"> into
          # ~/.m2/settings.xml mapping these two env-var names to
          # <username> and <password>. The plugin's
          # publishingServerId=central in pom.xml's release profile
          # (Track D3) wires up to this entry.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          # Imports the GPG key into the runner's keyring so the
          # maven-gpg-plugin (Track D2) can sign without an
          # interactive prompt.
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Install graph-compose-fonts (resolved at test scope by core)
        # The gate below runs before the reactor install and without `-am`, so core's
        # test-scope companions resolve from Central unless they are built here first,
        # and a tree may pin a companion version that is not published yet. Neither is
        # a gated artifact, so seeding them cannot supply a baseline.
        run: ./mvnw -B -ntp -f fonts/pom.xml -DskipTests install

      - name: Install graph-compose-emoji (resolved at test scope by core)
        run: ./mvnw -B -ntp -f emoji/pom.xml -DskipTests install

      - name: Drop cached GraphCompose artifacts before the gate resolves
        # Nothing of ours may stand in for a published baseline, so the pinned
        # coordinates are fetched from Central for this run. This runs before the
        # install below for the same reason: the release being published must not
        # be in the local repository while its own baselines resolve.
        run: |
          rm -rf ~/.m2/repository/io/github/demchaav/graph-compose-core
          rm -rf ~/.m2/repository/io/github/demchaav/graph-compose-templates

      - name: Verify binary compatibility against the published baselines
        # Defence in depth: run the japicmp gate on the tagged commit before any
        # deploy, so an accidental binary-incompatible change to the public surface
        # aborts the publish even when the tag reached here by bypassing branch
        # protection (the CI japicmp job only gates pull requests). One reactor run
        # diffs graph-compose-core and graph-compose-templates against the releases
        # their poms pin, exactly as the pull-request job does; templates resolves
        # the engine from the reactor rather than from the local repository, which
        # is what lets this run before the install below.
        run: ./mvnw -B -ntp -DskipTests -P japicmp verify -pl :graph-compose-core,:graph-compose-templates

      - name: Prove every japicmp execution ran
        # A japicmp execution that does not run writes no report and fails nothing,
        # so each one the gate relies on must have left its report.
        run: |
          test -s core/target/japicmp/japicmp-against-baseline.xml
          test -s templates/target/japicmp/japicmp-against-major-floor.xml
          test -s templates/target/japicmp/japicmp-against-previous-release.xml

      - name: Build, test and install to local m2 (verify + seed the release reactor)
        # Re-verify the tagged commit before publishing (defence in depth
        # against a tag pushed from a broken branch). `install` — not `verify` —
        # seeds the runner's local m2 with EVERY module artifact, including the
        # core tests-jar that render-pdf depends on at test scope but the release
        # profile never publishes (it unbinds that jar). The reactor deploy below
        # therefore resolves it (Maven resolves test-scope deps even with
        # -DskipTests) from this local m2, while every published artifact comes
        # from the reactor itself. It runs after the gate above, so the artifacts
        # it installs cannot serve as baselines.
        run: ./mvnw -B -ntp clean install

      - name: Announce a recovery run
        if: github.event.inputs.skip_published == 'true'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: echo "::warning::skip_published=true — components of $TAG already published on Maven Central are left out of this deployment. Recovery only."

      - name: Publish the release train to Maven Central (one deployment)
        id: train
        # One reactor run over exactly the lockstep train. `-P release` adds the
        # sources + javadoc jars, GPG-signs every artefact at verify, and lets the
        # central-publishing plugin replace deploy: each module is STAGED into one
        # shared directory, and the last module bundles all of them into
        # central-bundle.zip and uploads it once. The upload settings (autoPublish,
        # waitUntil) are therefore read from that last module's release profile —
        # PublishTrainGuardTest holds all eight identical. waitUntil=validated
        # blocks until Central validates the whole deployment; autoPublish=false
        # then leaves ONE deployment for the maintainer to publish on
        # central.sonatype.com.
        #
        # A failure in any module before the upload stops the plugin from
        # uploading anything ("Earlier build failures detected"), so nothing
        # partial reaches Central. Never widen the selection: -am would pull
        # fonts and emoji (core's test-scope deps) into the reactor and the
        # deployment, re-uploading coordinates they already published, and -amd
        # would pull in the build-only dependents (examples, qa, …).
        #
        # The whole train shares the plugin's waitMaxTime (1800 s). A run that
        # goes red on that wait may still leave a deployment that later reaches
        # VALIDATED — check the Central portal before re-dispatching, or the
        # re-dispatch uploads a second deployment.
        #
        # ignorePublishedComponents is false on every tag push and on a dispatch
        # that leaves skip_published unset. Set, the plugin asks the Central
        # Portal which of these components are already published and leaves those
        # out — the recovery for a version that is partially live.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SKIP_PUBLISHED: ${{ github.event.inputs.skip_published == 'true' }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -P release -DskipTests -Dgpg.skip=false -DdeploymentName="GraphCompose $TAG" -DignorePublishedComponents=$SKIP_PUBLISHED deploy -pl :graph-compose-core,:graph-compose-render-pdf,:graph-compose,:graph-compose-render-docx,:graph-compose-render-pptx,:graph-compose-templates,:graph-compose-testing,:graph-compose-bundle

      - name: Keep the deployment bundle with the run
        # The exact zip the plugin uploaded (or would have uploaded), for audit,
        # for smoking the VALIDATED deployment before publishing it
        # (scripts/release-smoke --staged-repo), and for a manual upload through
        # the Central portal if the API path is unavailable. The plugin writes it
        # under the first staged module's target/, hence the wildcard. Runs
        # whenever the deploy step ran, pass or fail — not when an earlier step
        # (an invalid tag, a red gate) kept it from running.
        if: ${{ !cancelled() && steps.train.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: central-bundle-${{ github.event.inputs.tag || github.ref_name }}
          path: '*/target/central-publishing/central-bundle.zip'
          if-no-files-found: warn
          retention-days: 90
