# The CV showcase samples an ATS check found ATS-friendly, and the evidence each badge stands on.
#
# One block per badged sample, keyed by its showcase card id:
#   preset       the preset class the sample renders
#   status       the status the check produced
#   validatedAt  the day the check ran
#   pdfSha256    SHA-256 of the exact PDF ats-check read: the sample's certification identity
#   textSha256   SHA-256 of that PDF's PDFBox text, in content-stream order then in position
#                order, with line and page breaks as \n; when the PDF changes, it says whether
#                the words changed with it
#
# ShowcaseAtsEvidenceTest renders every badged sample through a deterministic PDF backend, so
# unchanged code renders unchanged bytes, and writes each render to
# target/ats-certification/<card id>.pdf. It fails when a render is not, byte for byte, the file
# recorded here, and when the sample an example publishes draws a different document from that
# render. Never refresh a hash to make it pass: run the real ats-check on the renders it wrote,
# review the result, and only then update the block and ShowcaseMetadata.ATS_LAST_VALIDATED, or
# withdraw the badge. ShowcaseAtsClassificationTest keeps these blocks and the register's badged
# presets the same.

