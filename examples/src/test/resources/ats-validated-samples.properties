# The CV showcase samples a resume-parser check found ATS-friendly.
#
# One line per badged preset: the status the check produced, then a fingerprint of the text a
# parser reads from its showcase sample - the PDFBox text in content-stream order, then in
# position order, hashed with SHA-256.
#
# A badge is only as true as the sample it was earned on. When a change alters that text,
# ShowcaseAtsEvidenceTest fails until the sample is read with the parsers again and this line
# and ShowcaseMetadata.ATS_LAST_VALIDATED are updated, or the badge is withdrawn.
# ShowcaseAtsClassificationTest keeps this list and the register's badged presets the same.
